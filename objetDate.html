        const MONTHS= 1;
        const DAYS= 2;
        const YEARS= 0; 
        function addInterval(date, interval){
            const parts= [
                date.getFullYear(),    
                date.getMonth(), 
                date.getDate(),
                date.getHours(),
                date.getMinutes(),
                date.getSeconds(),
                date.getMilliseconds()
            ]
            for (const [unit, value] of Object.entries(interval)){
                parts[unit]+=value;
            }
            return new Date (...parts);
        }
