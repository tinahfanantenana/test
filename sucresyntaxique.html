<!DOCTYPE html>
<HTml>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sucre syntaxique</title>
    </head>
    <body>
        <script>
            let i = 0;
            console.log(i++) //affichera la valeur de i avant l'itération
            console.log(++i) //affichera la valeur après l'itération
            
        </script>
    </body>
</HTml>
