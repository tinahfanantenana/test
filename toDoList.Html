<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>ToDoList</title>
    <script type="module">
        import {ToDoList} from './toDolist.js'
        
        document.addEventListener('DOMContentLoaded', () => {
            let ul = document.querySelector('#taskList');

            let task = new ToDoList(ul);
            
            let btnAjoutTask= document.querySelector("#addTaskBtn");

            btnAjoutTask.addEventListener('click',()=>{
                let input=document.querySelector('#taskInput')
                let value=input.value.trim();

                if(value!=""){
                    task.addTask(value);
                    input.value="";
                }
                
            })

            //Délégation d'événement pour la suppression des taches car les boutons sont crées dynamiquement donc on ne peut pas leur attacher un écouteur d'événement directement sans qu'ils existent dans le DOM au moment de l'attachement.
            ul.addEventListener('click', (e)=>{
                const liElement = e.target.closest('li');

                if(e.target && e.target.id == "delete-btn") {
                    task.deleteTask(liElement);    
                }       

                
            });
            
            let btnFilter= document.querySelector(".btn-group");
            btnFilter.addEventListener('click',(e)=>{
                if(e.target && e.target.tagName ==="BUTTON"){
                    const filterId = e.target.id;
                    const filteredTasks = task.getTasks(filterId);
                    task.displayTasks(filteredTasks);
                }
            });
         });

         
    </script>
    
</head>
<body>
    <div class="container pt-5">
        <h1 class="text-center">To Do List</h1>
        <form class="d-flex pt-4">
            <div class="input-group">
                <input type="text" id="taskInput" class="form-control" placeholder="Ajouter une tâche...">
                <button id="addTaskBtn" type="button" class="btn btn-primary">Ajouter</button>
            </div>
        </form>
        

        <div class="btn-group mt-4">
            <button id="all" class="btn btn-primary ">Toute</button>
            <button id="toDo" class="btn btn-primary ms-1">A faire</button>
            <button id="done" class="btn btn-primary ms-1">Faits</button>
        </div>  

        <ul id="taskList" class="list-group mt-3">
            
        </ul>
        
    </div>
    <script src="./bootstrap/bootstrap.bundle.min.js"></script>  
</body>
</html>
