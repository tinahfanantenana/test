<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>ToDoList</title>
</head>
<body>
    <div class="container pt-5">
        <h1 class="text-center">To Do List</h1>
        <from class="d-flex pt-4">
            <div class="input-group">
                <input type="text" id="taskInput" class="form-control" placeholder="Ajouter une tâche...">
                <button id="addTaskBtn" class="btn btn-primary">Ajouter</button>
            </div>
        </from>
        

        <div class="btn-group mt-4">
            <button class="btn btn-primary ">Toute</button>
            <button class="btn btn-primary ms-1">A faire</button>
            <button class="btn btn-primary ms-1">Faits</button>
        </div>  

        <ul id="taskList" class="list-group mt-3">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Tâche 1
                <button class="btn btn-success btn-sm">Fait</button>
            </li>
            <!-- Les tâches seront ajoutées ici -->
        </ul>
        
    </div>
<script src="./bootstrap/bootstrap.bundle.min.js"></script>  
</body>
</html>
