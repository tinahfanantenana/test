        class Book{

            constructor(title, nbrPages){
                this._title= title;
                this._nbrPages= nbrPages;
            }

            nextPage(){
                if(this._page<=this._nbrPages && this._page!==undefined){
                    return this._page++;
                }else if(this._page==undefined){
                    return this._page=1;
                }
            }

            close (){
                return this._page= undefined
            }

            get page(){
                if(this._page!==undefined){
                    return this._page;
                }
                return 0;
            }
        }

        class Librarie{
            _lib=[]
            addBook(book){
                this._lib.push({name: book._title, nbrPages: book._nbrPages});
            }
            addBooks(book){
                if(Array.isArray(book)){
                    for(let b of book){
                        this.addBook(b);
                    }
                }    
            }
            findBookByLetter(letter){
                return this._lib.filter(b=> b.name.startsWith(letter));
            }
        }
