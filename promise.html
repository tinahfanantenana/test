<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
    <script>
       const p= new Promise((resolve,reject)=>{
           resolve(4);
       });

       function wait(ms){
           return new Promise((resolve,reject)=>{
               setTimeout(()=>resolve(ms),ms);
           });
       }

       function waitAndFail(ms){
           return new Promise((resolve,reject)=>{
               setTimeout(()=>{
                   reject(new Error("Failed after "+ms+" ms"));
               },ms);
           }); 
       }

         p.then((value)=>{
              console.log(value);
         });

        async function main(){
            try {
                let p1= await wait(2000);
                console.log(p1);
                let p2= await waitAndFail(3000);
                console.log(p2)
                let p3= await wait(3000);
                console.log(p3)
            } catch (error) {
                console.log('erreur capturé: '+error);
            }
            
        } 
        main().then(n=>console.log(n));
    </script>
</head>
<body>
    
</body>
</html>
